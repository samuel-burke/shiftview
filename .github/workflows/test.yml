name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels its older run. Pushes to main
# and dev are never cancelled, so every merge commit gets a full result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails if coverage drops below the floor in vitest.config.ts.
      - name: Unit tests with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  dependency-audit:
    # Known high or critical advisories in packages that ship to production.
    # Dev-only tooling advisories are reported by Dependabot instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm audit --omit=dev --audit-level=high

  security:
    # Security regression tests: every behavioural SQL suite in
    # supabase/manual-tests (RLS, cross-organization isolation, RPC privileges,
    # punch integrity) against a fresh database built the way a new project is,
    # plus unit tests named *.security.test.ts. Production runs Postgres 17.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Database security tests
        run: npm run test:sql

      - name: Security unit tests
        run: npm run test:security

  unit-timezones:
    # Date logic must not depend on the server's or browser's timezone. Re-run
    # the unit suite with the process clock at the far east of the date line
    # and in a half-hour, DST-observing zone (the unit job above runs in UTC).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: ["Pacific/Kiritimati", "America/St_Johns"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The specs mock every /api/* call and bypass auth, so no Supabase is
    # needed. Point the client at an unreachable address so test runs never
    # open Realtime subscriptions (with mock org ids) against production.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-placeholder-anon-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - run: npm run build

      - run: npm run test:e2e -- --project=mobile-chrome --project=mobile-chrome-far-timezone --project=tablet-chrome --project=tablet-landscape-chrome --project=desktop-chrome

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
