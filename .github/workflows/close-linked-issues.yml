name: Close linked issues

# GitHub closes "Closes #N" issues only when a pull request merges into the
# default branch (main). Pull requests here merge into dev, so do it then.
on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: read
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - run: node .github/scripts/close-linked-issues.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
